# GitHub authority for the Viewport OpenClaw production service in Dokploy.
# Dokploy source contract: sourceType=git, customGitUrl=https://github.com/viewport-corp/fork-openclaw.git,
# customGitBranch=main, composePath=deploy/dokploy.production.yml; no githubId/provider required.
# Shape mirrors the live container compose-bypass-neural-driver-ty4443-openclaw-gateway-1 (2026-09-30),
# on the OFFICIAL upstream image. Upgrade order and rollback: deploy/dokploy.desired-state.json.
name: fork-openclaw

x-openclaw-image: &openclaw-image ghcr.io/openclaw/openclaw:2026.9.5@sha256:ea298b62be8955d3ef750e2004a610dd90c3a30e5f9886e5d654d78a0c573218

services:
  openclaw-gateway:
    container_name: ${OPENCLAW_CONTAINER_NAME:-viewport-openclaw}
    image: *openclaw-image
    pull_policy: if_not_present
    # No entrypoint override: the official image entrypoint (tini) must run as shipped.
    command: [node, dist/index.js, gateway, --bind, lan, --port, "18789"]
    restart: unless-stopped
    # Live operator-access feature (viewport-ops#572, 2026-08-30): the agent drives the
    # docker-viewport daemon through the socket, which is group 988 on the host.
    group_add: ["988"]
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    # Env NAMES only: values come from the Dokploy env (deploy/.env, used for interpolation)
    # and never live in Git. Only the names listed here reach the gateway.
    # Container-side paths are pinned as in the official compose, so host paths
    # in the Dokploy env cannot leak into the runtime.
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      TZ: ${OPENCLAW_TZ:-UTC}
      # Phase 1 desired config reads ${LITELLM_API_KEY}; empty until added to the Dokploy env.
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      # Same names as the live container (Dokploy env, 2026-09-30).
      APP_NAME: ${APP_NAME}
      AUTH_SECRET: ${AUTH_SECRET}
      BROWSERBASE_ADVANCED_STEALTH: ${BROWSERBASE_ADVANCED_STEALTH}
      BROWSERBASE_PROXIES: ${BROWSERBASE_PROXIES}
      BROWSER_INACTIVITY_TIMEOUT: ${BROWSER_INACTIVITY_TIMEOUT}
      BROWSER_SESSION_TIMEOUT: ${BROWSER_SESSION_TIMEOUT}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_API_KEY: ${CF_API_KEY}
      CF_DEST_ACCOUNT_ID: ${CF_DEST_ACCOUNT_ID}
      CF_DEST_API_KEY: ${CF_DEST_API_KEY}
      CF_DEST_EMAIL: ${CF_DEST_EMAIL}
      CF_EMAIL: ${CF_EMAIL}
      CF_SOURCE_ACCOUNT_ID: ${CF_SOURCE_ACCOUNT_ID}
      CF_SOURCE_API_KEY: ${CF_SOURCE_API_KEY}
      CF_SOURCE_EMAIL: ${CF_SOURCE_EMAIL}
      CF_TOKEN_SAFE: ${CF_TOKEN_SAFE}
      CF_TOKEN_SAFE_ID: ${CF_TOKEN_SAFE_ID}
      CF_TOKEN_ZONE_MANAGE: ${CF_TOKEN_ZONE_MANAGE}
      CF_TOKEN_ZONE_MANAGE_ID: ${CF_TOKEN_ZONE_MANAGE_ID}
      CF_ZONE_ID: ${CF_ZONE_ID}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      CLIPROXY_API_KEY: ${CLIPROXY_API_KEY}
      COGNEE_DB_PATH: ${COGNEE_DB_PATH}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY}
      COMPOSIO_CF_AUTH_CONFIG_ID: ${COMPOSIO_CF_AUTH_CONFIG_ID}
      COMPOSIO_MCP_SERVER_ID: ${COMPOSIO_MCP_SERVER_ID}
      COMPOSIO_MCP_URL: ${COMPOSIO_MCP_URL}
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN}
      DOCKER_CONFIG: ${DOCKER_CONFIG}
      DOCKER_GID: ${DOCKER_GID}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      GATEWAY_ALLOW_ALL_USERS: ${GATEWAY_ALLOW_ALL_USERS}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_TOKEN_VIEWPORT_CORP: ${GITHUB_TOKEN_VIEWPORT_CORP}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      HERMES_OPERATOR_NAME: ${HERMES_OPERATOR_NAME}
      HERMES_OWNER: ${HERMES_OWNER}
      HERMES_TIMEZONE: ${HERMES_TIMEZONE}
      IMAGE_TOOLS_DEBUG: ${IMAGE_TOOLS_DEBUG}
      IMPORTED_SLACK_BOT_TOKEN: ${IMPORTED_SLACK_BOT_TOKEN}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LINEAR_API_KEY: ${LINEAR_API_KEY}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN}
      MOA_TOOLS_DEBUG: ${MOA_TOOLS_DEBUG}
      MODERNLAO_ADMIN_LOGIN: ${MODERNLAO_ADMIN_LOGIN}
      MODERNLAO_BOT_LOGIN: ${MODERNLAO_BOT_LOGIN}
      MODERNLAO_GARY_BOOKMARK: ${MODERNLAO_GARY_BOOKMARK}
