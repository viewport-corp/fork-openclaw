# GitHub authority for the Viewport OpenClaw production service in Dokploy.
# Dokploy source contract: sourceType=git, customGitUrl=https://github.com/viewport-corp/fork-openclaw.git,
# customGitBranch=main, composePath=deploy/dokploy.production.yml; no githubId/provider required.
# Shape mirrors the live container compose-bypass-neural-driver-ty4443-openclaw-gateway-1 (2026-09-30),
# on the OFFICIAL upstream image. Upgrade order and rollback: deploy/dokploy.desired-state.json.
name: fork-openclaw

x-openclaw-image: &openclaw-image ghcr.io/openclaw/openclaw:2026.9.5@sha256:ea298b62be8955d3ef750e2004a610dd90c3a30e5f9886e5d654d78a0c573218

services:
  openclaw-gateway:
    container_name: ${OPENCLAW_CONTAINER_NAME:-viewport-openclaw}
    image: *openclaw-image
    pull_policy: if_not_present
    # No entrypoint override: the official image entrypoint (tini) must run as shipped.
    command: [node, dist/index.js, gateway, --bind, lan, --port, "18789"]
    restart: unless-stopped
    # Live operator-access feature (viewport-ops#572, 2026-08-30): the agent drives the
    # docker-viewport daemon through the socket, which is group 988 on the host.
    group_add: ["988"]
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    # Dokploy writes its stored env to deploy/.env; values never live in Git.
    env_file:
      - path: .env
        required: true
    # Container-side paths pinned as in the official compose, so host paths in .env
    # (OPENCLAW_CONFIG_DIR, OPENCLAW_WORKSPACE_DIR) cannot leak into the runtime.
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      TZ: ${OPENCLAW_TZ:-UTC}
    networks:
      default:
        aliases: [openclaw-gateway]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      timeout: 5s
      interval: 30s
      retries: 5
      start_period: 20s
    # The edge routes to 127.0.0.1:47295 on the host, not to a fixed container IP.
    ports:
      - "127.0.0.1:47295:18789"
      - "127.0.0.1:47296:18790"
      - "127.0.0.1:3978:3978"
    volumes:
      - /srv/viewport/runtime/openclaw-viewport/config:/home/node/.openclaw
      - /srv/viewport/runtime/openclaw-viewport/workspace:/home/node/.openclaw/workspace
      - /srv/viewport/runtime/openclaw-viewport/auth-secrets:/home/node/.config/openclaw
      - /srv/viewport/runtime/openclaw-viewport/codex-auth:/home/node/.codex
      - /srv/viewport/runtime/openclaw-viewport/ssh:/home/node/.ssh:ro
      - /var/run/docker-viewport.sock:/var/run/docker.sock
      # Same as live; narrowing these is a separate hardening issue.
      - /srv/viewport:/srv/viewport
      - /opt/platformx:/opt/platformx

networks:
  default:
    name: ${OPENCLAW_NETWORK_NAME:-fork-openclaw_default}
    external: true
