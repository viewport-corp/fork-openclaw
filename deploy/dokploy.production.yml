      N8N_USER_MANAGEMENT_DISABLED: ${N8N_USER_MANAGEMENT_DISABLED}
      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY}
      NAMECHEAP_API_USER: ${NAMECHEAP_API_USER}
      NAMECHEAP_CLIENT_IP: ${NAMECHEAP_CLIENT_IP}
      NAMECOM_API_TOKEN_PROD: ${NAMECOM_API_TOKEN_PROD}
      NAMECOM_API_TOKEN_TEST: ${NAMECOM_API_TOKEN_TEST}
      NAMECOM_API_URL: ${NAMECOM_API_URL}
      NAMECOM_API_USER_PROD: ${NAMECOM_API_USER_PROD}
      NAMECOM_API_USER_TEST: ${NAMECOM_API_USER_TEST}
      NAMECOM_TOKEN: ${NAMECOM_TOKEN}
      NAMECOM_USER: ${NAMECOM_USER}
      NOTION_API_KEY: ${NOTION_API_KEY}
      NOTION_PAGE_ID: ${NOTION_PAGE_ID}
      NOTION_TOKEN: ${NOTION_TOKEN}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_DEEPSEEK_KEY: ${NVIDIA_DEEPSEEK_KEY}
      NVIDIA_DEEPSEEK_TERMINUS_KEY: ${NVIDIA_DEEPSEEK_TERMINUS_KEY}
      NVIDIA_GRANITE_KEY: ${NVIDIA_GRANITE_KEY}
      NVIDIA_KIMI_K2_KEY: ${NVIDIA_KIMI_K2_KEY}
      NVIDIA_KIMI_KEY: ${NVIDIA_KIMI_KEY}
      NVIDIA_LLAMA_405B_KEY: ${NVIDIA_LLAMA_405B_KEY}
      NVIDIA_LLAMA_KEY: ${NVIDIA_LLAMA_KEY}
      NVIDIA_MISTRAL_KEY: ${NVIDIA_MISTRAL_KEY}
      NVIDIA_NEMOTRON_NANO_KEY: ${NVIDIA_NEMOTRON_NANO_KEY}
      NVIDIA_QWEN_KEY: ${NVIDIA_QWEN_KEY}
      ODOO_DB: ${ODOO_DB}
      ODOO_MLG_BOT_PASSWORD: ${ODOO_MLG_BOT_PASSWORD}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      ODOO_URL: ${ODOO_URL}
      ODOO_USER: ${ODOO_USER}
      OPENCLAW_AUTH_SECRET_DIR: ${OPENCLAW_AUTH_SECRET_DIR}
      OPENCLAW_BRIDGE_PORT: ${OPENCLAW_BRIDGE_PORT}
      OPENCLAW_DOCKER_SOCK: ${OPENCLAW_DOCKER_SOCK}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND}
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in the Dokploy env}
      OPENCLAW_HOOKS_TOKEN: ${OPENCLAW_HOOKS_TOKEN}
      OPENCLAW_IMAGE: ${OPENCLAW_IMAGE}
      OPENCLAW_SKIP_ONBOARDING: ${OPENCLAW_SKIP_ONBOARDING}
      OPENCLAW_SSH_DIR: ${OPENCLAW_SSH_DIR}
      OPENCLAW_TZ: ${OPENCLAW_TZ}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PLATFORMX_DOCKER_LEGACY: ${PLATFORMX_DOCKER_LEGACY}
      PLATFORMX_DOCKER_VIEWPORT: ${PLATFORMX_DOCKER_VIEWPORT}
      PLATFORMX_ROOT_SSH_TARGET: ${PLATFORMX_ROOT_SSH_TARGET}
      PLATFORMX_VPS_HOST: ${PLATFORMX_VPS_HOST}
      PLATFORMX_VPS_TAILSCALE_IP: ${PLATFORMX_VPS_TAILSCALE_IP}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY}
      PORKBUN_API_KEY: ${PORKBUN_API_KEY}
      PORKBUN_SECRET_KEY: ${PORKBUN_SECRET_KEY}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID}
      SLACK_DISABLED_REASON: ${SLACK_DISABLED_REASON}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in the Dokploy env}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL}
      TELEGRAM_HOME_CHANNEL_NAME: ${TELEGRAM_HOME_CHANNEL_NAME}
      TERMINAL_LIFETIME_SECONDS: ${TERMINAL_LIFETIME_SECONDS}
      TERMINAL_MODAL_IMAGE: ${TERMINAL_MODAL_IMAGE}
      TERMINAL_TIMEOUT: ${TERMINAL_TIMEOUT}
      VISION_TOOLS_DEBUG: ${VISION_TOOLS_DEBUG}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEB_TOOLS_DEBUG: ${WEB_TOOLS_DEBUG}
    networks:
      default:
        aliases: [openclaw-gateway]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      timeout: 5s
      interval: 30s
      retries: 5
      start_period: 20s
    # The edge routes to 127.0.0.1:47295 on the host, not to a fixed container IP.
    ports:
      - "127.0.0.1:47295:18789"
      - "127.0.0.1:47296:18790"
      - "127.0.0.1:3978:3978"
    volumes:
      - /srv/viewport/runtime/openclaw-viewport/config:/home/node/.openclaw
      - /srv/viewport/runtime/openclaw-viewport/workspace:/home/node/.openclaw/workspace
      - /srv/viewport/runtime/openclaw-viewport/auth-secrets:/home/node/.config/openclaw
      - /srv/viewport/runtime/openclaw-viewport/codex-auth:/home/node/.codex
      - /srv/viewport/runtime/openclaw-viewport/ssh:/home/node/.ssh:ro
      - /var/run/docker-viewport.sock:/var/run/docker.sock
      # Same as live; narrowing these is a separate hardening issue.
      - /srv/viewport:/srv/viewport
      - /opt/platformx:/opt/platformx

networks:
  default:
    name: ${OPENCLAW_NETWORK_NAME:-fork-openclaw_default}
    external: true
