# Isolated validation only. Every mutable stage identity/path must be explicit.
# Stage never sees live secrets: no host secret-file mount, no Dokploy .env file, and the channel
# token names are forced empty. The copied stage config must disable every channel.
name: ${OPENCLAW_STAGE_PROJECT:?set an isolated stage project name}

x-openclaw-image: &openclaw-image ${OPENCLAW_IMAGE:?set the reviewed candidate image digest}

x-stage-env: &stage-env
  HOME: /home/node
  OPENCLAW_HOME: /home/node
  OPENCLAW_STATE_DIR: /home/node/.openclaw
  OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
  OPENCLAW_CONFIG_DIR: /home/node/.openclaw
  OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
  OPENCLAW_GATEWAY_PORT: "18789"
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_STAGE_GATEWAY_TOKEN:?set the stage-only gateway token}
  TZ: ${OPENCLAW_TZ:-UTC}
  TELEGRAM_BOT_TOKEN: ""
  DISCORD_BOT_TOKEN: ""
  SLACK_BOT_TOKEN: ""
  SLACK_APP_TOKEN: ""
  MODERNLAO_TELEGRAM_BOT_TOKEN: ""
  IMPORTED_SLACK_BOT_TOKEN: ""

services:
  stage-config-check:
    image: *openclaw-image
    container_name: ${OPENCLAW_STAGE_CONFIG_CHECK_CONTAINER:?set an isolated config-check container name}
    user: "1000:1000"
    entrypoint: [tini, -s, --, /bin/sh, -ec]
    command:
      - |
        node /app/openclaw.mjs config validate
        node /app/openclaw.mjs secrets audit --check
        node /viewport/deploy/validate-stage-config.mjs /home/node/.openclaw/openclaw.json stage
    environment: *stage-env
    network_mode: none
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./validate-stage-config.mjs:/viewport/deploy/validate-stage-config.mjs:ro
      - ../docs/reference/secretref-user-supplied-credentials-matrix.json:/viewport/docs/reference/secretref-user-supplied-credentials-matrix.json:ro
      - type: bind
        source: ${OPENCLAW_STAGE_CONFIG_SOURCE:?set the copied stage config path}
        target: /home/node/.openclaw
        read_only: true
        bind:
          create_host_path: false

  openclaw-gateway:
    image: *openclaw-image
    container_name: ${OPENCLAW_STAGE_GATEWAY_CONTAINER:?set an isolated gateway container name}
    command: [node, dist/index.js, gateway, --bind, lan, --port, "18789"]
    environment: *stage-env
    depends_on:
      stage-config-check:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    networks:
      default:
        ipv4_address: ${OPENCLAW_STAGE_IPV4_ADDRESS:?set an isolated stage address}
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      timeout: 5s
      interval: 10s
      retries: 8
      start_period: 20s
    ports:
      - "127.0.0.1:${OPENCLAW_STAGE_HOST_GATEWAY_PORT:?set an unused loopback port}:18789"
      - "127.0.0.1:${OPENCLAW_STAGE_HOST_BRIDGE_PORT:?set an unused loopback port}:18790"
      - "127.0.0.1:${OPENCLAW_STAGE_HOST_MSTEAMS_PORT:?set an unused loopback port}:3978"
    volumes:
      - type: bind
        source: ${OPENCLAW_STAGE_CONFIG_SOURCE:?set the copied stage config path}
        target: /home/node/.openclaw
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCLAW_STAGE_WORKSPACE_SOURCE:?set the copied stage workspace path}
        target: /home/node/.openclaw/workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCLAW_STAGE_AUTH_SOURCE:?set the copied stage auth path}
        target: /home/node/.config/openclaw
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENCLAW_STAGE_CODEX_AUTH_SOURCE:?set the copied stage Codex auth path}
        target: /home/node/.codex
        bind:
          create_host_path: false

networks:
  default:
    name: ${OPENCLAW_STAGE_NETWORK:?set an isolated stage network name}
    ipam:
      config:
        - subnet: ${OPENCLAW_STAGE_SUBNET:?set an unused stage subnet}
          gateway: ${OPENCLAW_STAGE_GATEWAY:?set the stage gateway address}
