name: Viewport Dokploy Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - ui/package.json
      - openclaw.mjs
      - "src/**"
      - "extensions/**"
      - "packages/**"
      - "scripts/**"
      - deploy/project-platformx-env.mjs
      - deploy/validate-stage-config.mjs
      - deploy/openclaw-entrypoint.sh
      - .github/workflows/viewport-dokploy-image.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - ui/package.json
      - openclaw.mjs
      - "src/**"
      - "extensions/**"
      - "packages/**"
      - "scripts/**"
      - "deploy/**"
      - .github/workflows/viewport-dokploy-image.yml

permissions:
  contents: read

concurrency:
  group: viewport-dokploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-projector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10 peeled commit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify allowlist, alias, quoting, and stage isolation
        run: |
          node deploy/project-platformx-env.test.mjs
          node deploy/validate-stage-config.test.mjs
          node deploy/check-dokploy-desired-state.mjs

  build:
    if: github.event_name == 'pull_request'
    needs: test-projector
    runs-on: ubuntu-24.04
    env:
      OPENCLAW_EXTENSIONS: diagnostics-otel,codex,discord,google,groq,nvidia,openai,openrouter,slack,telegram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build candidate for content verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: viewport-openclaw-candidate:${{ github.event.pull_request.head.sha }}
          build-args: OPENCLAW_EXTENSIONS=${{ env.OPENCLAW_EXTENSIONS }}
          cache-from: type=gha,scope=viewport-dokploy-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=sha-${{ github.event.pull_request.head.sha }}
            io.viewport.test-revision=${{ github.sha }}

      - name: Verify production plugins and deployment helpers
        shell: bash
        run: |
          set -euo pipefail
          image="viewport-openclaw-candidate:${{ github.event.pull_request.head.sha }}"
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            for plugin in codex discord google groq nvidia openai openrouter slack telegram; do
              test -d "/app/extensions/${plugin}"
            done
            test -x /app/deploy/project-platformx-env.mjs
            test -x /app/deploy/validate-stage-config.mjs
            test -x /app/deploy/openclaw-entrypoint.sh
            test "$(pnpm --version)" = "11.24.0"
            test ! -e /usr/local/lib/node_modules/npm
            ! command -v npm >/dev/null 2>&1
          '

      - name: Scan the exact PR candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 peeled commit
        with:
          image-ref: viewport-openclaw-candidate:${{ github.event.pull_request.head.sha }}
          format: json
          output: trivy-pr.json
          exit-code: "0"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Upload the complete PR vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewport-openclaw-trivy-${{ github.event.pull_request.head.sha }}
          path: trivy-pr.json
          if-no-files-found: error
          retention-days: 14

      - name: Block fixable Critical and High vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          fixable_count="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length > 0))] | length' trivy-pr.json)"
          vendor_unfixed_count="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length == 0))] | length' trivy-pr.json)"
          {
            printf '### Vulnerability admission\n\n'
            printf -- '- Fixable Critical/High: `%s`\n' "$fixable_count"
            printf -- '- Vendor-unfixed Critical/High: `%s` (reported in the complete Trivy artifact; not hidden)\n' "$vendor_unfixed_count"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$vendor_unfixed_count" -ne 0 ]; then
            jq -r '.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length == 0)) | [.Severity, .PkgName, .InstalledVersion, "vendor-unfixed", .VulnerabilityID] | @tsv' trivy-pr.json
          fi
          if [ "$fixable_count" -ne 0 ]; then
            jq -r '.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length > 0)) | [.Severity, .PkgName, .InstalledVersion, .FixedVersion, .VulnerabilityID] | @tsv' trivy-pr.json
            exit 1
          fi

      - name: Export reviewed PR candidate
        shell: bash
        run: docker save "viewport-openclaw-candidate:${{ github.event.pull_request.head.sha }}" | gzip -1 > "viewport-openclaw-${{ github.event.pull_request.head.sha }}.tar.gz"

      - name: Upload reviewed PR candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewport-openclaw-${{ github.event.pull_request.head.sha }}
          path: viewport-openclaw-${{ github.event.pull_request.head.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-projector
    runs-on: ubuntu-24.04
    environment: viewport-dokploy-production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      OPENCLAW_EXTENSIONS: diagnostics-otel,codex,discord,google,groq,nvidia,openai,openrouter,slack,telegram
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the main-branch candidate locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: viewport-openclaw-publish:${{ github.sha }}
          build-args: OPENCLAW_EXTENSIONS=${{ env.OPENCLAW_EXTENSIONS }}
          cache-from: type=gha,scope=viewport-dokploy-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}

      - name: Verify production plugins and deployment helpers before publication
        shell: bash
        run: |
          set -euo pipefail
          image="viewport-openclaw-publish:${{ github.sha }}"
          docker run --rm --entrypoint /bin/sh "$image" -ec '
            for plugin in codex discord google groq nvidia openai openrouter slack telegram; do
              test -d "/app/extensions/${plugin}"
            done
            test -x /app/deploy/project-platformx-env.mjs
            test -x /app/deploy/validate-stage-config.mjs
            test -x /app/deploy/openclaw-entrypoint.sh
            test "$(pnpm --version)" = "11.24.0"
            test ! -e /usr/local/lib/node_modules/npm
            ! command -v npm >/dev/null 2>&1
          '

      - name: Scan the exact local main-branch candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 peeled commit
        with:
          image-ref: viewport-openclaw-publish:${{ github.sha }}
          format: json
          output: trivy-prepublish.json
          exit-code: "0"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Upload the pre-publication vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewport-openclaw-prepublish-${{ github.sha }}
          path: trivy-prepublish.json
          if-no-files-found: error
          retention-days: 30

      - name: Block publication on fixable Critical and High vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          fixable_count="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length > 0))] | length' trivy-prepublish.json)"
          vendor_unfixed_count="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length == 0))] | length' trivy-prepublish.json)"
          {
            printf '### Pre-publication vulnerability admission\n\n'
            printf -- '- Fixable Critical/High: `%s`\n' "$fixable_count"
            printf -- '- Vendor-unfixed Critical/High: `%s` (reported in the complete Trivy artifact; not hidden)\n' "$vendor_unfixed_count"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$vendor_unfixed_count" -ne 0 ]; then
            jq -r '.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length == 0)) | [.Severity, .PkgName, .InstalledVersion, "vendor-unfixed", .VulnerabilityID] | @tsv' trivy-prepublish.json
          fi
          if [ "$fixable_count" -ne 0 ]; then
            jq -r '.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length > 0)) | [.Severity, .PkgName, .InstalledVersion, .FixedVersion, .VulnerabilityID] | @tsv' trivy-prepublish.json
            exit 1
          fi

      - name: Generate the exact-candidate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 peeled commit
        with:
          image-ref: viewport-openclaw-publish:${{ github.sha }}
          format: cyclonedx
          output: viewport-openclaw-${{ github.sha }}.cdx.json
          scanners: vuln

      - name: Upload the exact-candidate SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewport-openclaw-sbom-${{ github.sha }}
          path: viewport-openclaw-${{ github.sha }}.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Log in to GHCR after admission
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the already-scanned exact image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          local_image="viewport-openclaw-publish:${GITHUB_SHA}"
          image_name="ghcr.io/${GITHUB_REPOSITORY}"
          image_tag="${image_name}:sha-${GITHUB_SHA}"
          docker tag "$local_image" "$image_tag"
          docker push "$image_tag"
          published_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_tag")"
          case "$published_ref" in
            "${image_name}"@sha256:*) ;;
            *) echo "registry returned an invalid image reference: $published_ref" >&2; exit 1 ;;
          esac
          digest="${published_ref#*@}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid digest: $digest" >&2
            exit 1
          fi
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${image_name}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest exact-image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest the exact-image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: viewport-openclaw-${{ github.sha }}.cdx.json
          push-to-registry: true

      - name: Pull and verify the exact published digest
        shell: bash
        env:
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$PUBLISHED_IMAGE"
          docker run --rm --entrypoint /bin/sh "$PUBLISHED_IMAGE" -ec '
            for plugin in codex discord google groq nvidia openai openrouter slack telegram; do
              test -d "/app/extensions/${plugin}"
            done
            test -x /app/deploy/project-platformx-env.mjs
            test -x /app/deploy/validate-stage-config.mjs
            test -x /app/deploy/openclaw-entrypoint.sh
          '

      - name: Scan the exact published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 peeled commit
        with:
          image-ref: ${{ steps.publish.outputs.image }}
          format: json
          output: trivy-published.json
          exit-code: "0"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Upload the published-digest vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewport-openclaw-published-${{ github.sha }}
          path: trivy-published.json
          if-no-files-found: error
          retention-days: 30

      - name: Admit the published digest for Dokploy
        shell: bash
        run: |
          set -euo pipefail
          fixable_count="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length > 0))] | length' trivy-published.json)"
          vendor_unfixed_count="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length == 0))] | length' trivy-published.json)"
          if [ "$vendor_unfixed_count" -ne 0 ]; then
            jq -r '.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length == 0)) | [.Severity, .PkgName, .InstalledVersion, "vendor-unfixed", .VulnerabilityID] | @tsv' trivy-published.json
          fi
          if [ "$fixable_count" -ne 0 ]; then
            jq -r '.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and ((.FixedVersion // "") | length > 0)) | [.Severity, .PkgName, .InstalledVersion, .FixedVersion, .VulnerabilityID] | @tsv' trivy-published.json
            exit 1
          fi
          {
            printf '### Dokploy image admitted\n\n'
            printf '`%s`\n\n' '${{ steps.publish.outputs.image }}'
            printf -- '- Fixable Critical/High: `%s`\n' "$fixable_count"
            printf -- '- Vendor-unfixed Critical/High: `%s` (reported in the complete Trivy artifact; not hidden)\n' "$vendor_unfixed_count"
          } >> "$GITHUB_STEP_SUMMARY"
